<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sugar Sugar Rune</title>
    <link rel="stylesheet" href="./style/reset.css" />
    <link rel="stylesheet" href="./style/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Outfit:wght@800&display=swap"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <div class="poster">
      <!-- 하트 -->
      <div class="heart heart-red">
        <img src="./assets/빨간 하트.png" alt="" />
      </div>
      <div class="heart heart-orange">
        <img src="./assets/주황하트 .png" alt="" />
      </div>
      <div class="heart heart-yellow">
        <img src="./assets/노란하트.png" alt="" />
      </div>
      <div class="heart heart-green">
        <img src="./assets/초록하트.png" alt="" />
      </div>
      <div class="heart heart-pink">
        <img src="./assets/핑크하트.png" alt="" />
      </div>

      <!-- 캐릭터 -->
      <div class="chocolat">
        <img
          class="school"
          src="./assets/쇼콜라 교복 버전4.png"
          alt="쇼콜라 교복"
        />
        <img
          class="witch"
          src="./assets/쇼콜라 마법사 버전.png"
          alt="쇼콜라 마법사"
        />
      </div>
      <div class="vanilla">
        <img
          class="school"
          src="./assets/바닐라 교복 버전.png"
          alt="바닐라 교복"
        />
        <img
          class="witch"
          src="./assets/바닐라 마법사 버전.png"
          alt="바닐라 마법사"
        />
      </div>

      <img class="logo" src="./assets/슈가슈가룬 로고.png" alt="슈가슈가룬" />

      <!-- 기본 문구 -->
      <div class="poster-text">
        <h2>당신의 마음은 무슨 색인가요?</h2>
        <p>쇼콜라와 바닐라, 두 마녀의 이야기</p>
      </div>

      <!-- 캐릭터 소개 -->
      <div class="character-info chocolat-info">
        <h3>CHOCOLAT</h3>
        <p class="character-keyword">당당하고 솔직한 마녀</p>
        <p class="character-description">
          진심 어린 마음으로 마계의 여왕을 꿈꾼다.
        </p>
      </div>

      <div class="character-info vanilla-info">
        <h3>VANILLA</h3>
        <p class="character-keyword">상냥하고 수줍은 마녀</p>
        <p class="character-description">
          따뜻한 마음을 품고 여왕의 자리에 도전한다.
        </p>
      </div>
    </div>

    <img class="mouse-wand" src="./assets/핑크 하트 마법봉.png" alt="" />
  </body>
</html>
